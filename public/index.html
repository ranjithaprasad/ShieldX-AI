<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#212121">
  <title>ShieldX AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #212121;
      color: #ececec;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 22px;
      border-bottom: 1px solid #383838;
      font-size: 19px;
      font-weight: bold;
    }
    .logo {
      background: #16a085;
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      margin-right: 11px;
    }
    main {
      flex: 1;
      overflow-y: auto;
      width: 100%;
      max-width: 850px;
      margin: auto;
      padding: 30px 20px 150px;
    }
    .welcome {
      text-align: center;
      margin: 15vh auto 30px;
    }
    .welcome h1 {
      font-size: clamp(27px, 5vw, 36px);
      margin-bottom: 12px;
    }
    .welcome p { color: #aaa; font-size: 15px; }
    #messages {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .message {
      padding: 15px 19px;
      border-radius: 18px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-width: 90%;
    }
    .user {
      align-self: flex-end;
      background: #303030;
    }
    .assistant {
      align-self: flex-start;
      background: transparent;
      max-width: 100%;
    }
    .composer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 18px 16px 22px;
      background: linear-gradient(transparent, #212121 18%);
    }
    .input-wrap {
      max-width: 800px;
      margin: auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 12px;
      border: 1px solid #555;
      border-radius: 25px;
      background: #303030;
    }
    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: white;
      font: inherit;
      padding: 8px;
      max-height: 150px;
      min-height: 28px;
    }
    button {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: #16a085;
      color: white;
      font-size: 21px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    .note {
      text-align: center;
      color: #888;
      font-size: 11px;
      margin-top: 9px;
    }
    @media(max-width: 600px) {
      header { padding: 0 15px; }
      main { padding: 20px 14px 140px; }
      .message { max-width: 95%; }
      .composer { padding: 12px 10px 18px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">S</div>
    ShieldX AI
  </header>

  <main id="chat">
    <section class="welcome" id="welcome">
      <h1>What can I help you with?</h1>
      <p>Your AI assistant for learning and exploring cybersecurity.</p>
    </section>
    <div id="messages"></div>
  </main>

  <div class="composer">
    <form class="input-wrap" id="chatForm">
      <textarea id="messageInput" rows="1"
        placeholder="Message ShieldX AI..." required></textarea>
      <button id="sendBtn" type="submit" aria-label="Send">↑</button>
    </form>
    <div class="note">ShieldX AI can make mistakes. Verify important information.</div>
  </div>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");
    const sendBtn = document.getElementById("sendBtn");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      messages.appendChild(div);
      document.getElementById("chat").scrollTop =
        document.getElementById("chat").scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message || sendBtn.disabled) return;

      welcome.style.display = "none";
      addMessage(message, "user");
      input.value = "";
      sendBtn.disabled = true;

      const reply = addMessage("Thinking...", "assistant");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Something went wrong.");
        }
        reply.textContent = data.answer || "No response received.";
      } catch (error) {
        reply.textContent = "Sorry, I couldn't connect. " + error.message;
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
