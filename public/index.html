<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#212121">
<title>ShieldX AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#212121;color:#eee;font-family:Arial,sans-serif;height:100vh;display:flex;overflow:hidden}
button,textarea{font:inherit}
.sidebar{width:260px;background:#171717;padding:15px;display:flex;flex-direction:column;flex-shrink:0}
.brand{font-size:20px;font-weight:bold;padding:10px 5px 22px}
.new-chat,.side-btn{background:transparent;color:white;border:1px solid #555;border-radius:9px;padding:12px;text-align:left;cursor:pointer;margin-bottom:9px}
.new-chat:hover,.side-btn:hover,.history-item:hover{background:#303030}
.history-title{font-size:12px;color:#999;margin:18px 5px 10px}
.history{overflow-y:auto;flex:1}
.history-item{display:flex;align-items:center;gap:7px;padding:10px;border-radius:8px;cursor:pointer;font-size:14px}
.history-item.active{background:#303030}
.history-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.delete{border:0;background:transparent;color:#999;cursor:pointer;font-size:16px;padding:3px}
.delete:hover{color:white}
.sidebar-note{font-size:11px;color:#777;padding:12px 4px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
header{height:60px;border-bottom:1px solid #383838;display:flex;align-items:center;padding:0 20px;gap:12px;font-weight:bold}
.menu{display:none;background:none;color:white;border:0;font-size:23px;cursor:pointer}
.chat{flex:1;overflow-y:auto;padding:25px 18px 30px}
.welcome{text-align:center;margin:17vh auto 30px}
.welcome h1{font-size:clamp(26px,4vw,36px);margin-bottom:10px}
.welcome p{color:#999}
.messages{max-width:800px;margin:auto;display:flex;flex-direction:column;gap:22px}
.message{max-width:90%;padding:14px 18px;border-radius:18px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-end;background:#303030}
.assistant{align-self:flex-start}
.composer{padding:15px 18px 20px}
.input-wrap{max-width:800px;margin:auto;display:flex;align-items:flex-end;gap:10px;background:#303030;border:1px solid #555;border-radius:25px;padding:11px}
textarea{flex:1;resize:none;background:transparent;color:white;border:0;outline:0;padding:8px;min-height:28px;max-height:140px}
.send{width:40px;height:40px;border:0;border-radius:50%;background:#16a085;color:white;font-size:22px;cursor:pointer}
.send:disabled{opacity:.5}
.note{text-align:center;color:#888;font-size:11px;margin-top:9px}
.overlay{display:none}
.modal-overlay{display:none;position:fixed;inset:0;background:#0009;z-index:10;align-items:center;justify-content:center;padding:15px}
.modal-overlay.show{display:flex}
.modal{width:100%;max-width:420px;background:#252525;border:1px solid #555;border-radius:16px;padding:22px}
.modal h2{margin:0 0 8px}
.modal p{color:#aaa;font-size:14px;line-height:1.5}
.modal button{width:100%;padding:12px;border-radius:9px;border:1px solid #555;background:#333;color:white;margin-top:10px;cursor:pointer}
.modal button.primary{background:#16a085;border-color:#16a085}
.modal button.danger{color:#ff7777}
.modal button.close{background:transparent}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0}
.setting-row select{background:#333;color:white;border:1px solid #555;padding:8px;border-radius:8px}
body.light{background:#f5f5f5;color:#222}
body.light .sidebar{background:#e9e9e9}
body.light .new-chat,body.light .side-btn{color:#222;border-color:#bbb}
body.light .history-item.active,body.light .history-item:hover{background:#d8d8d8}
body.light header{border-color:#ddd}
body.light .user{background:#e2e2e2}
body.light .input-wrap{background:#fff;border-color:#bbb}
body.light textarea{color:#222}
body.light .modal{background:#fff;color:#222;border-color:#ccc}
body.light .modal p{color:#555}
body.light .modal button{background:#eee;color:#222;border-color:#ccc}
body.light .modal button.primary{background:#16a085;color:white}
body.light .modal button.danger{color:#c22}
body.light .modal button.close{background:transparent}
body.light .note{color:#777}
@media(max-width:650px){
.sidebar{position:fixed;z-index:5;top:0;bottom:0;left:-270px;transition:left .2s}
.sidebar.open{left:0}
.menu{display:block}
.overlay.show{display:block;position:fixed;inset:0;background:#0009;z-index:4}
.chat{padding:20px 12px 30px}
.composer{padding:12px 10px 16px}
.message{max-width:96%}
}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="brand">🛡️ ShieldX AI</div>
  <button class="new-chat" id="newChat">＋ New Chat</button>
  <div class="history-title">CHAT HISTORY</div>
  <div class="history" id="history"></div>
  <button class="side-btn" id="exportCurrent">↓ Export Current Chat</button>
  <button class="side-btn" id="exportAll">↓ Export All Chats</button>
  <button class="side-btn" id="openSettings">⚙️ Settings</button>
  <div class="sidebar-note">Your conversations are saved in this browser.</div>
</aside>

<section class="main">
<header>
  <button class="menu" id="menu" aria-label="Open menu">☰</button>
  ShieldX AI
</header>

<main class="chat" id="chat">
  <section class="welcome" id="welcome">
    <h1>What can I help you with?</h1>
    <p>Your AI assistant for learning and exploring cybersecurity.</p>
  </section>
  <div class="messages" id="messages"></div>
</main>

<div class="composer">
  <form class="input-wrap" id="form">
    <textarea id="input" rows="1" placeholder="Message ShieldX AI..." required></textarea>
    <button class="send" id="send" type="submit" aria-label="Send">↑</button>
  </form>
  <div class="note">ShieldX AI can make mistakes. Verify important information.</div>
</div>
</section>

<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>⚙️ Settings</h2>
    <p>Manage your ShieldX AI preferences.</p>

    <div class="setting-row">
      <span>Appearance</span>
      <select id="themeSelect">
        <option value="dark">Dark mode</option>
        <option value="light">Light mode</option>
      </select>
    </div>

    <button class="primary" id="modalExportCurrent">↓ Export Current Chat</button>
    <button id="modalExportAll">↓ Export All Chats</button>
    <button class="danger" id="clearHistory">Delete All Chat History</button>
    <button class="close" id="closeSettings">Close</button>
  </div>
</div>

<script>
const STORAGE_KEY="shieldx_chat_history_v1";
const THEME_KEY="shieldx_theme_v1";

const sidebar=document.getElementById("sidebar");
const overlay=document.getElementById("overlay");
const historyBox=document.getElementById("history");
const messagesBox=document.getElementById("messages");
const welcome=document.getElementById("welcome");
const input=document.getElementById("input");
const send=document.getElementById("send");
const chat=document.getElementById("chat");
const settingsModal=document.getElementById("settingsModal");

let conversations=[];
let currentId=null;
let busy=false;

try{
  conversations=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
  if(!Array.isArray(conversations))conversations=[];
}catch{conversations=[];}

function save(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(conversations));
  }catch{
    alert("Browser storage is full. Please delete some old conversations.");
  }
}

function makeId(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

function currentConversation(){
  return conversations.find(c=>c.id===currentId);
}

function addBubble(text,type){
  const div=document.createElement("div");
  div.className="message "+type;
  div.textContent=text;
  messagesBox.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
  return div;
}

function render(){
  messagesBox.replaceChildren();
  const conversation=currentConversation();
  welcome.style.display=conversation&&conversation.messages.length?"none":"block";
  if(conversation){
    conversation.messages.forEach(m=>addBubble(m.content,m.role));
  }
  renderHistory();
}

function renderHistory(){
  historyBox.replaceChildren();
  [...conversations].reverse().forEach(c=>{
    const row=document.createElement("div");
    row.className="history-item"+(c.id===currentId?" active":"");

    const name=document.createElement("span");
    name.className="history-name";
    name.textContent=c.title||"New conversation";
    name.onclick=()=>openChat(c.id);

    const del=document.createElement("button");
    del.className="delete";
    del.textContent="×";
    del.title="Delete conversation";
    del.setAttribute("aria-label","Delete conversation");
    del.onclick=e=>{
      e.stopPropagation();
      if(!confirm("Delete this conversation?"))return;
      conversations=conversations.filter(x=>x.id!==c.id);
      if(currentId===c.id)currentId=null;
      save();
      render();
    };

    row.append(name,del);
    row.onclick=()=>openChat(c.id);
    historyBox.appendChild(row);
  });
}

function openChat(id){
  currentId=id;
  render();
  closeSidebar();
}

function newChat(){
  if(busy)return;
  currentId=null;
  input.value="";
  render();
  input.focus();
  closeSidebar();
}

function closeSidebar(){
  sidebar.classList.remove("open");
  overlay.classList.remove("show");
}

function downloadText(filename,content){
  const blob=new Blob([content],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function safeFilename(name){
  return (name||"ShieldX-chat")
    .replace(/[^a-z0-9-_ ]/gi,"")
    .trim()
    .replace(/\s+/g,"-")
    .slice(0,45)||"ShieldX-chat";
}

function exportCurrent(){
  const c=currentConversation();
  if(!c||!c.messages.length){
    alert("There is no conversation to export. Open a chat first.");
    return;
  }
  let content="ShieldX AI - Conversation\n";
  content+="Title: "+c.title+"\n";
  content+="Date: "+new Date(c.updatedAt||Date.now()).toLocaleString()+"\n\n";
  c.messages.forEach(m=>{
    content+=(m.role==="user"?"YOU":"SHIELDX AI")+":\n";
    content+=m.content+"\n\n";
  });
  downloadText(safeFilename(c.title)+".txt",content);
}

function exportAll(){
  if(!conversations.length){
    alert("There are no saved conversations to export.");
    return;
  }
  let content="SHIELDX AI - ALL CONVERSATIONS\n\n";
  conversations.forEach((c,i)=>{
    content+="================================\n";
    content+=(i+1)+". "+(c.title||"New conversation")+"\n";
    content+="================================\n\n";
    c.messages.forEach(m=>{
      content+=(m.role==="user"?"YOU":"SHIELDX AI")+":\n";
      content+=m.content+"\n\n";
    });
    content+="\n";
  });
  downloadText("ShieldX-all-conversations.txt",content);
}

function applyTheme(theme){
  document.body.classList.toggle("light",theme==="light");
  document.getElementById("themeSelect").value=theme;
  try{localStorage.setItem(THEME_KEY,theme);}catch{}
}

document.getElementById("newChat").onclick=newChat;
document.getElementById("menu").onclick=()=>{
  sidebar.classList.add("open");
  overlay.classList.add("show");
};
overlay.onclick=closeSidebar;

document.getElementById("exportCurrent").onclick=exportCurrent;
document.getElementById("exportAll").onclick=exportAll;
document.getElementById("modalExportCurrent").onclick=exportCurrent;
document.getElementById("modalExportAll").onclick=exportAll;

document.getElementById("openSettings").onclick=()=>{
  settingsModal.classList.add("show");
  closeSidebar();
};
document.getElementById("closeSettings").onclick=()=>{
  settingsModal.classList.remove("show");
};
settingsModal.addEventListener("click",e=>{
  if(e.target===settingsModal)settingsModal.classList.remove("show");
});

document.getElementById("themeSelect").onchange=e=>{
  applyTheme(e.target.value);
};

document.getElementById("clearHistory").onclick=()=>{
  if(!confirm("Are you sure you want to delete ALL saved conversations? This cannot be undone."))return;
  conversations=[];
  currentId=null;
  save();
  render();
  settingsModal.classList.remove("show");
  alert("All chat history has been deleted.");
};

document.getElementById("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const message=input.value.trim();
  if(!message||busy)return;

  if(!currentId){
    currentId=makeId();
    conversations.push({
      id:currentId,
      title:message.slice(0,45),
      messages:[],
      updatedAt:Date.now()
    });
  }

  const conversation=currentConversation();
  conversation.messages.push({role:"user",content:message});
  conversation.updatedAt=Date.now();
  save();
  render();

  input.value="";
  busy=true;
  send.disabled=true;
  const reply=addBubble("Thinking...","assistant");

  try{
    const response=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message})
    });
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||"Request failed.");

    const answer=data.answer||"No response received.";
    reply.textContent=answer;
    conversation.messages.push({role:"assistant",content:answer});
  }catch(error){
    reply.textContent="Sorry, I couldn't connect. "+error.message;
  }finally{
    conversation.updatedAt=Date.now();
    save();
    renderHistory();
    busy=false;
    send.disabled=false;
    input.focus();
  }
});

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    document.getElementById("form").requestSubmit();
  }
});

let savedTheme="dark";
try{savedTheme=localStorage.getItem(THEME_KEY)||"dark";}catch{}
applyTheme(savedTheme);
renderHistory();
</script>
</body>
</html>
